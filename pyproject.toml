[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secretsentinel"
version = "0.1.0.dev0"
description = "Detect hard-coded secrets in working trees and git history."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "macorifice" }]
keywords = ["security", "secrets", "sast", "git", "devsecops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1",
    "rich>=13.7",
    "pyyaml>=6.0",
    "gitpython>=3.1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
secretsentinel = "secretsentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
secretsentinel = ["rules/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
